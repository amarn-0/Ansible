- name: create ec2
  hosts: localhost
  connection: local
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      image_id: "ami-0220d79f3f480ecf5"
      instance_type: "t3.micro"
      security_group: "sg-01d559ae05d4950f8"
    loop:
      - mysql
    register: ec2_output

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"