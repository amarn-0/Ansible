- name: create ec2
  hosts: local
  connection: local
  vars:
    image_id: "ami-0220d79f3f480ecf5"
    instance_type: "t3.micro"
    security_group: "sg-01d559ae05d4950f8"
    domain_name: "amaranath.fun"
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      image_id: "{{ image_id }}"
      instance_type: "{{ instance_type }}"
      security_group: "{{ security_group }}"
    loop: "{{ instances }}"
    register: ec2_output

  # - name: print the ec2_output
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output }}"
  - name: create r53 record
    amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
    loop: "{{ ec2_output.results }}"

  - name: create r53 public record
    amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        wait: true
    when: item.item == "frontend"
    loop: "{{ ec2_output.results }}"